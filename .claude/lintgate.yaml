quality_policy:
  coverage:
    global_threshold: 80
    diff_threshold: 80
    source_packages:
      - lintgate
      - mcp_tools
  security:
    tolerated_false_positives:
      - rule: "pythonsecurity:S2083"
        file: "lintgate/reset.py"
        reason: "Read-modify-writeback of same local file; no HTTP input path"
      - rule: "python:S5852"
        scope: "**/*.py"
        reason: "Local dev tool — all regex inputs from local files/tool output"

controlplane:
  enabled: true
  inquiry:
    theory_grounded_signals: true
    prediction_tracking: true
    theory_coherence_check: true
    living_context: true
    session_gate: true

severity_overrides:
  B110: informational   # try_except_pass — intentional fail-open
  B112: informational   # try_except_continue — same pattern
  B105: informational   # hardcoded_password_string — test fixtures
  B106: informational   # hardcoded_password_funcarg — test fixtures
  B310: informational   # urllib.request.urlopen — HTTPS API call with timeout, not arbitrary URL
  B311: informational   # random.Random — deterministic probe variant selection, not crypto

pipeline_critical_paths:
  - "lintgate/hook_posttooluse.py"
  - "lintgate/controlplane/"

exemptions:
  structure:
    "test_channel.py":
      codes: ["cognitive-complexity"]
      reason: "Impacted-test discovery is intentionally centralized for now."
      ticket: "LINTGATE-DEBT-101"
    "reporter.py":
      codes: ["too-many-statements", "cognitive-complexity"]
      reason: "Mesh reporter formatting logic is still monolithic."
      ticket: "LINTGATE-DEBT-102"
    "test_archetype_selector.py":
      codes: ["too-many-attributes"]
      reason: "SourceSignals carries broad extraction metadata pending split."
      ticket: "LINTGATE-DEBT-103"
    "hook_posttooluse.py":
      codes: ["cognitive-complexity"]
      reason: "ControlPlane path still in transitional orchestration function."
      ticket: "LINTGATE-DEBT-104"
    "lint_runner.py":
      codes: ["cognitive-complexity"]
      reason: "Parallel runner includes timeout/degrade policy in one function."
      ticket: "LINTGATE-DEBT-105"
    "theory_extractor.py":
      codes: ["file-too-long", "cognitive-complexity"]
      reason: "Extractor is intentionally consolidated pending module split."
      ticket: "LINTGATE-DEBT-106"
    "mcp_server.py":
      codes: ["file-too-long"]
      reason: "MCP surface still consolidated in single entrypoint module."
      ticket: "LINTGATE-DEBT-107"
  complexity:
    "reporter.py":
      codes: ["complexity"]
      reason: "Mesh reporter cyclomatic complexity tracked as structured debt."
      ticket: "LINTGATE-DEBT-108"
    "theory_extractor.py":
      codes: ["complexity"]
      reason: "Theory claim scoring complexity tracked as structured debt."
      ticket: "LINTGATE-DEBT-109"
