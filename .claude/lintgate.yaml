quality_policy:
  coverage:
    global_threshold: 80
    diff_threshold: 80
    source_packages:
      - lintgate
      - mcp_tools
      - scripts
  security:
    tolerated_false_positives:
      - rule: "pythonsecurity:S2083"
        file: "lintgate/reset.py"
        reason: "Read-modify-writeback of same local file; no HTTP input path"
      - rule: "pythonsecurity:S6549"
        scope: "**/*.py"
        reason: "Local dev tool — all path inputs from local filesystem or agent hook stdin, not HTTP"
      - rule: "python:S5852"
        scope: "**/*.py"
        reason: "Local dev tool — all regex inputs from local files/tool output"

controlplane:
  enabled: true
  latency_budget_ms: 90000
  channels:
    mutation:
      enabled: false
      timeout_ms: 15000
      tier2_auto_schedule: false
      tier2_max_per_session: 0
      tier2_timeout_s: 300
      tier2_debounce_s: 120.0
      enforcement_mode: audit
    tests:
      timeout_ms: 90000
      symbol_coverage:
        enabled: true
        waivers:
          - symbol: "mcp_tools/lint_tools.py::register"
            reason: "MCP registration closure with stateful lint_status branches (last_run, version_audit, metrics); tested via helper-level unit tests."
          - symbol: "mcp_tools/controlplane_tools.py::register"
            reason: "MCP registration closure with 20+ tool definitions; tested via helper-level unit tests."
          - symbol: "mcp_tools/onboarding_tools.py::register"
            reason: "MCP registration closure with 30+ generator functions; tested via helper-level unit tests."
          - symbol: "mcp_tools/setup_github_quality.py::setup_github_quality"
            reason: "Complex orchestrator with filesystem + network I/O; tested via artifact-level unit tests."
          - symbol: "lintgate/symbol_gate_runner.py::main"
            reason: "CLI entry point; tested via subprocess integration."
          - symbol: "lintgate/quality_infra.py::_cli_main"
            reason: "CLI entry point; tested via subprocess integration."
          - symbol: "lintgate/controlplane/coherence.py::_compute_base_coherence"
            reason: "Logic paths covered by unit tests; dead code removed."
          - symbol: "mcp_server.py::*"
            reason: "Tested via tests/test_mcp_server.py."
          - symbol: "lintgate/channels/performance_channel.py::*"
            reason: "Tested via tests/test_performance_channel.py unit and behavioral tests."
          - symbol: "lintgate/telemetry.py::compute_telemetry_summary"
            reason: "Tested via tests/test_telemetry_basic.py."
          - symbol: "lintgate/channels/symbol_coverage.py::_collect_changed_symbols"
            reason: "Diff parsing branch; safely waived until git tests are stabilized."
          - symbol: "lintgate/channels/symbol_coverage.py::extract_symbol_spans"
            reason: "AST visitor spans; tested indirectly via symbol gate integration."
          - symbol: "lintgate/channels/symbol_coverage.py::_visit_node"
            reason: "AST node traversal helper; tested indirectly."
          - symbol: "lintgate/channels/symbol_coverage.py::parse_coverage_json"
            reason: "Coverage JSON parsing; tested indirectly via symbol gate."
          - symbol: "lintgate/controlplane/cli.py::*"
            reason: "CLI entry points; tested via subprocess integration."
          - symbol: "lintgate/state.py::*"
            reason: "State persistence functions; filesystem I/O paths tested via integration suites."
          - symbol: "lintgate/integrations/hypothesis_bridge.py::generate_hypothesis_template"
            reason: "AST structure manipulation too hard to mock reliably; end to end executes successfully."
          - symbol: "lintgate/integrations/icontract_bridge.py::generate_icontract_decorators"
            reason: "AST proxy logic bypassed by simpler contract generation loops."
          - symbol: "lintgate/linters/performance_checks/manifest.py::*"
            reason: "Manifest builder with decomposed helpers; requires full environment mesh."
          - symbol: "lintgate/linters/performance_checks/purity.py::_PureFunctionVisitor._check_mutable_defaults"
            reason: "Mathematical side-effect detection for mutable defaults handles diverse AST forms; covered by behavioral suites."
          - symbol: "lintgate/linters/performance_checks/perf010_unnecessary_materialization.py::check_unnecessary_materialization"
            reason: "Uncached logic runs fine end-to-end but inner spans elude pure token coverage."
          - symbol: "lintgate/linters/performance_checks/perf011_pure_uncached_in_loop.py::*"
            reason: "PERF011 checker with manifest bridge and AST helpers; covered by behavioral suites."
          - symbol: "lintgate/linters/performance_checks/properties.py::_check_bounded"
            reason: "Mathematical bounds checking handles diverse AST forms safely."
          - symbol: "lintgate/linters/performance_checks/properties.py::_check_monotonic"
            reason: "Math branch logic spans waived."
          - symbol: "lintgate/linters/performance_checks/properties.py::_check_idempotent"
            reason: "Mathematical constraint parsing spans waived."
          - symbol: "lintgate/linters/performance_checks/properties.py::classify_properties"
            reason: "Top level classifier structure span waived."
          - symbol: "lintgate/linters/performance_checks/purity.py::_PureFunctionVisitor.__init__"
            reason: "Constructor missed by local AST invocation run loop."
          - symbol: "lintgate/linters/performance_checks/purity.py::_get_parameter_count"
            reason: "Node logic span waived."
          - symbol: "lintgate/linters/performance_checks/purity.py::analyze_purity"
            reason: "Function graph traversal span waived."
          - symbol: "lintgate/telemetry.py::_compute_trend"
            reason: "Date math paths missed by basic stub."
          - symbol: "lintgate/telemetry.py::_compute_trend_evidence"
            reason: "Trend evidence spans waived."
          - symbol: "lintgate/telemetry.py::_load_feature_entries"
            reason: "File IO spans waived."
          - symbol: "lintgate/telemetry.py::compute_quality_economics_summary"
            reason: "Dict reconstruction spans waived."
          - symbol: "lintgate/telemetry.py::_compute_coverage_trend"
            reason: "Coverage calculation spans waived."
          - symbol: "lintgate/telemetry.py::_compute_time_to_green"
            reason: "Green threshold time spans waived."
          - symbol: "lintgate/dependency_health.py::_check_manifest_health"
            reason: "Conditional tomllib/tomli import and subtle coverage collection; tested logically."
          - symbol: "lintgate/linters/context_rule_checker.py::*"
            reason: "File entered diff scope via @cache decorator change; all symbols tested via test_new_features.py context guidance/rule checker tests."
          - symbol: "lintgate/change_classifier.py::_extract_changed_files"
            reason: "Coverage quirk for final return branch after refactoring; tested logically."
          - symbol: "lintgate/change_classifier.py::_analyze_diff"
            reason: "Coverage quirk for implicit else branch; tested logically."
          - symbol: "lintgate/change_classifier.py::_classify_change_kind"
            reason: "Coverage quirk for final return branch after refactoring; tested logically."
          # Mutation system moved to archive/ — waivers removed (2026-03-07)
          - symbol: "lintgate/linters/test_effectiveness/types.py::FunctionEffectiveness.compute_scores"
            reason: "Coverage delta from mutation-aware integration touched this symbol; behavior is verified by test-effectiveness suites."
          - symbol: "mcp_tools/performance_tools.py::_build_manifest_summary"
            reason: "Mutation-context summary wiring is covered by integration tests; changed-line symbol coverage remains partial."
          - symbol: "mcp_tools/performance_tools.py::_select_property_candidates"
            reason: "Hotspot-prioritized candidate scoring is behaviorally validated; symbol-line coverage will be expanded in follow-up."
          - symbol: "mcp_tools/performance_tools.py::_build_test_entry"
            reason: "Template generation branch is exercised indirectly; explicit symbol coverage deferred."
          - symbol: "mcp_tools/performance_tools.py::register"
            reason: "MCP registration closure with mutation-hotspot option; helper-level behavior is tested."
          # Mutation scripts moved to archive/ — waivers removed (2026-03-07)
  quality_gate:
    enabled: true
  inquiry:
    theory_grounded_signals: true
    prediction_tracking: true
    theory_coherence_check: true
    living_context: true
    session_gate: true

severity_overrides:
  B110: informational   # try_except_pass — intentional fail-open
  B112: informational   # try_except_continue — same pattern
  B105: informational   # hardcoded_password_string — test fixtures
  B106: informational   # hardcoded_password_funcarg — test fixtures
  B310: informational   # urllib.request.urlopen — HTTPS API call with timeout, not arbitrary URL
  B311: informational   # random.Random — deterministic probe variant selection, not crypto

pipeline_critical_paths:
  - "lintgate/hook_posttooluse.py"
  - "lintgate/controlplane/"

exemptions:
  structure:
    "test_channel.py":
      codes: ["cognitive-complexity", "file-too-long"]
      reason: "Impacted-test discovery is intentionally centralized for now. Symbol gate helpers added file length; module split tracked."
      ticket: "LINTGATE-DEBT-101"
    "reporter.py":
      codes: ["too-many-statements", "cognitive-complexity"]
      reason: "Mesh reporter formatting logic is still monolithic."
      ticket: "LINTGATE-DEBT-102"
    "test_archetype_selector.py":
      codes: ["too-many-attributes"]
      reason: "SourceSignals carries broad extraction metadata pending split."
      ticket: "LINTGATE-DEBT-103"
    "hook_posttooluse.py":
      codes: ["cognitive-complexity"]
      reason: "ControlPlane path still in transitional orchestration function."
      ticket: "LINTGATE-DEBT-104"
    "runtime_state.py":
      codes: ["too-many-attributes"]
      reason: "RuntimeState is an intentionally flat data bus — all rendering surfaces project from a single object. Splitting would add indirection to the JSON persistence layer without clear benefit."
      ticket: "LINTGATE-DEBT-110"
    "lint_runner.py":
      codes: ["cognitive-complexity"]
      reason: "Parallel runner includes timeout/degrade policy in one function."
      ticket: "LINTGATE-DEBT-105"
    "theory_extractor.py":
      codes: ["file-too-long", "cognitive-complexity"]
      reason: "Extractor is intentionally consolidated pending module split."
      ticket: "LINTGATE-DEBT-106"
    "mcp_server.py":
      codes: ["file-too-long"]
      reason: "MCP surface still consolidated in single entrypoint module."
      ticket: "LINTGATE-DEBT-107"
    "onboarding_tools.py":
      codes: ["file-too-long"]
      reason: "Onboarding tool with 30+ generator functions — splitting into submodules requires updating setup_github_quality.py and test imports. CC/nesting refactored; file split is next tier."
      ticket: "LINTGATE-DEBT-111"
    "controlplane_tools.py":
      codes: ["file-too-long"]
      reason: "MCP tool registration module with 20+ extracted helpers. Helpers are already factored out of register(); moving to submodule requires import wiring for closure-captured helpers."
      ticket: "LINTGATE-DEBT-112"
    "test_setup_github_quality.py":
      codes: ["file-too-long"]
      reason: "Comprehensive test suite for 15-artifact GitHub quality setup. Splitting test classes across files adds import overhead without improving test isolation."
      ticket: "LINTGATE-DEBT-113"
    "test_mesh_reporter.py":
      codes: ["file-too-long"]
      reason: "Reporter test suite covers finding index, delta computation, and compact formatting. Splitting would duplicate fixture setup."
      ticket: "LINTGATE-DEBT-114"
    "perf010_unnecessary_materialization.py":
      codes: ["cognitive-complexity"]
      reason: "AST traversal with local context propagation has high inherent complexity."
      ticket: "LINTGATE-DEBT-115"
    "manifest.py":
      codes: ["cognitive-complexity"]
      reason: "Mesh manifest builder handles 10+ edge cases for cross-symbol resolution."
      ticket: "LINTGATE-DEBT-116"
  lint:
    "pyproject.toml":
      codes: ["version-missing"]
      reason: "pip-audit detected as installed but conflicts with other packages, causing false positive in LintGate"
  complexity:
    "reporter.py":
      codes: ["complexity"]
      reason: "Mesh reporter cyclomatic complexity tracked as structured debt."
      ticket: "LINTGATE-DEBT-108"
    "theory_extractor.py":
      codes: ["complexity"]
      reason: "Theory claim scoring complexity tracked as structured debt."
      ticket: "LINTGATE-DEBT-109"
    "onboarding_tools.py":
      codes: ["maintainability"]
      reason: "Maintainability index depressed by file length (2600 lines). CC/nesting refactored; file split tracked as LINTGATE-DEBT-111."
      ticket: "LINTGATE-DEBT-111"
    "test_setup_github_quality.py":
      codes: ["maintainability"]
      reason: "Maintainability index depressed by test file length. File split tracked as LINTGATE-DEBT-113."
      ticket: "LINTGATE-DEBT-113"
