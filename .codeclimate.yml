version: "2"

checks:
  # Cognitive complexity — our bread and butter
  method-complexity:
    enabled: true
    config:
      threshold: 20

  file-lines:
    enabled: true
    config:
      threshold: 500

  method-lines:
    enabled: true
    config:
      threshold: 100

  method-count:
    enabled: true
    config:
      threshold: 30

  return-statements:
    enabled: true
    config:
      threshold: 8

  argument-count:
    enabled: true
    config:
      threshold: 8

  # Duplication detection
  identical-code:
    enabled: true
    config:
      threshold: 3

  similar-code:
    enabled: true
    config:
      threshold: 3

plugins:
  # Python analysis
  radon:
    enabled: true
    config:
      threshold: "C"  # Flag CC > 15

  # Duplication engine
  duplication:
    enabled: true
    config:
      languages:
        python:
          mass_threshold: 40

exclude_patterns:
  - "tests/"
  - "docs/"
  - ".claude/"
  - "**/__pycache__/"
  - "*.egg-info/"
