name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build Project
        run: lake build
      - name: Check Core Modules
        run: |
          lake env lean MutationTheory/Phase_5_Specification_Complexity.lean
          lake env lean MutationTheory/Phase_6_Exact_Learning.lean
          lake env lean MutationTheory/Phase_7.lean
