# SonarCloud configuration for LintGate
sonar.projectKey=rohanvinaik_LintGate
sonar.organization=rohanvinaik
sonar.projectName=LintGate

# Source layout
sonar.sources=lintgate,mcp_tools
sonar.tests=tests
sonar.python.version=3.11

# Exclusions — test fixtures, generated files, docs
sonar.exclusions=\
  tests/**,\
  docs/**,\
  .claude/**,\
  **/__pycache__/**,\
  *.egg-info/**,\
  *.sh

# Coverage (optional; generated in CI if available)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=lintgate/hook_posttooluse.py

# Tolerated false positives (deterministic, reproducible in forks)
# S2083: Path traversal — LintGate is a local CLI tool; project_root comes from the
#   host IDE/agent hook (PostToolUse stdin), not from HTTP/network input.
#   Taint: hook_posttooluse.py stdin → project_root → Path() in runtime_state.py, reset.py, etc.
# S5852: ReDoS — local dev tool; all regex inputs from local files/tool output, not user-controlled
sonar.issue.ignore.multicriteria=fp1,fp2
sonar.issue.ignore.multicriteria.fp1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.fp1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.fp2.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.fp2.resourceKey=**/*.py
