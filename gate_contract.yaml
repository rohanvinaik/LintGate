version: "1.0"

required_checks:
  - "Tests (3.11)"
  - "Tests (3.12)"
  - "Qlty"
  # "SonarQube Cloud Scan" — temporarily non-blocking (check never reports on PRs)

ci_workflows:
  - ".github/workflows/tests.yml"
  - ".github/workflows/qlty.yml"
  - ".github/workflows/sonarcloud.yml"
  - ".github/workflows/security-lite.yml"
  - ".github/workflows/codeql.yml"
  - ".github/workflows/quality-infra-gate.yml"

local_pre_push:
  - id: "quality_infra"
    command: "python -m lintgate.quality_infra --enforce"
  - id: "qlty"
    command: "qlty check --all"
  - id: "gitleaks"
    command: "gitleaks detect --source . --no-banner --redact"
  - id: "tests"
    command: "python -m pytest"
  - id: "symbol_gate"
    command: "python -m lintgate.symbol_gate_runner"
  - id: "pip_audit"
    command: "pip-audit"

parity_map:
  # local gate ID → CI required_check name (null = local-only or embedded)
  # Every required_checks entry must appear as a value here.
  # Every local_pre_push ID must appear as a key here.
  quality_infra: null
  qlty: "Qlty"
  gitleaks: null
  tests: ["Tests (3.11)", "Tests (3.12)"]
  symbol_gate: null
  pip_audit: null
  sonar:
    ci_check: "SonarQube Cloud Scan"
    local_mode: "ci_only"

symbol_gate:
  # Single source of truth for advisory policy.
  # Consumed by: .githooks/pre-push, .github/workflows/tests.yml, scripts/ship_main.py
  advisory_policy:
    # Branch patterns where symbol gate failures are non-blocking (fnmatch syntax)
    advisory_branches:
      - "main"
      - "codex/ship-main-*"
      - "codex/ship-*"
    # PR events always advisory (historical diffs inflate scope)
    pr_always_advisory: true
  # Base commit strategy for ship flows (merge-base vs head~1)
  ship_base_strategy: "merge-base"

ci:
  # CI triggers only on pull_request + push to main.
  # Side-branch pushes do NOT trigger CI — local pre-push is the developer gate.
  # ship_main.py creates a PR which triggers CI as the single remote authority.
  branch_trigger_policy: "pr_and_main_only"

tools:
  qlty:
    init_policy: "dry_run_then_init"
    shellcheckrc_policy: "backup_restore"
  sonar:
    local_mode: "ci_only"
    freshness_source: "ci_check_run"

toolchain:
  # Single source of truth for CLI tool provisioning.
  # Consumed by: getting_started(), pre-push hook, tool_health_check MCP tool.
  # Self-managing: reconcile_with_registry() warns when a linter's required_tool
  # is missing from this manifest.
  tools:
    # --- Core linter (always needed) ---
    - id: ruff
      kind: python_cli
      package: "ruff>=0.4.0"
      required: true
      required_by: [lint]
      auto_install: true

    # --- Optional Python linters ---
    - id: mypy
      kind: python_cli
      package: "mypy>=1.8"
      required: false
      required_by: [lint]
      auto_install: true

    - id: ty
      kind: python_cli
      package: "ty>=0.0.17"
      required: false
      required_by: [lint]
      auto_install: true

    - id: radon
      kind: python_cli
      package: "radon>=6.0"
      required: false
      required_by: [lint]
      auto_install: true

    - id: bandit
      kind: python_cli
      package: "bandit>=1.7"
      required: false
      required_by: [lint, ci]
      auto_install: true

    - id: pip-audit
      kind: python_cli
      package: "pip-audit>=2.6"
      required: false
      required_by: [pre_push, ci]
      auto_install: true

    - id: vulture
      kind: python_cli
      package: "vulture>=2.0"
      required: false
      required_by: [lint]
      auto_install: true

    # --- Gate stack tools (native binaries) ---
    - id: qlty
      kind: native_binary
      required: true
      required_by: [pre_push, ci]
      auto_install: false
      install:
        darwin: "brew install qlty || curl -sSL https://qlty.sh/install | sh"
        linux: "curl -sSL https://qlty.sh/install | sh"

    - id: gitleaks
      kind: native_binary
      required: true
      required_by: [pre_push, ci]
      auto_install: false
      install:
        darwin: "brew install gitleaks"
        linux: "brew install gitleaks"

compliance:
  # Minimum rolling compliance rate (0.0-1.0) required to ship
  min_rate: 0.8
  # Whether to block ship if the rate is below min_rate
  block_on_low_compliance: true
