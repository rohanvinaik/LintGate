version: "2.0"

# Required CI checks — must pass before merge.
# Maps to job names in .github/workflows/ci.yml
required_checks:
  - "Tests (3.11)"
  - "Tests (3.12)"
  - "SonarQube"

ci_workflows:
  - ".github/workflows/ci.yml"
  - ".github/workflows/codeql.yml"
  - ".github/workflows/spec-badges.yml"
  - ".github/workflows/deploy-docs.yml"

ci:
  branch_trigger_policy: "pr_and_main_only"

# Toolchain manifest — consumed by getting_started() and tool_health_check
toolchain:
  tools:
    - id: ruff
      kind: python_cli
      package: "ruff>=0.4.0"
      required: true
      required_by: [lint, ci]
      auto_install: true

    - id: mypy
      kind: python_cli
      package: "mypy>=1.8"
      required: false
      required_by: [lint]
      auto_install: true

    - id: ty
      kind: python_cli
      package: "ty>=0.0.17"
      required: false
      required_by: [lint]
      auto_install: true

    - id: radon
      kind: python_cli
      package: "radon>=6.0"
      required: false
      required_by: [lint]
      auto_install: true

    - id: bandit
      kind: python_cli
      package: "bandit>=1.7"
      required: false
      required_by: [lint]
      auto_install: true

    - id: pip-audit
      kind: python_cli
      package: "pip-audit>=2.6"
      required: false
      required_by: [lint]
      auto_install: true

    - id: vulture
      kind: python_cli
      package: "vulture>=2.0"
      required: false
      required_by: [lint]
      auto_install: true
