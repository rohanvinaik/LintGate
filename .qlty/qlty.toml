# LintGate qlty configuration
# Tuned for a Python linter-infrastructure project.
#
# qlty CLI docs: https://docs.qlty.sh/qlty-toml
# Run: qlty check --all
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
  "**/vendor/**",
  "**/__pycache__/**",
  "**/.mypy_cache/**",
  "**/.ruff_cache/**",
  "**/.pytest_cache/**",
  "**/.benchmarks/**",
]

test_patterns = [
  "**/tests/**",
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# ── Plugins ──────────────────────────────────────────────────────────

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trivy"
drivers = ["config"]

[[plugin]]
name = "trufflehog"

# ── Triage: Silence domain-expected false positives ──────────────────

# bandit:B101 — assert in test files is standard pytest usage
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["**/tests/**", "**/test_*.*"]
set.ignored = true

# bandit:B108 — temp file usage in test fixtures is expected
[[triage]]
match.rules = ["bandit:B108"]
match.file_patterns = ["**/tests/**", "**/test_*.*"]
set.ignored = true

# bandit:B404 — subprocess import is core to a linter runner
[[triage]]
match.rules = ["bandit:B404"]
set.ignored = true

# bandit:B603 — subprocess calls with partial paths are intentional
# (we invoke ruff, mypy, bandit etc. by name)
[[triage]]
match.rules = ["bandit:B603"]
set.ignored = true

# bandit:B607 — same: invoking linters by name is the whole point
[[triage]]
match.rules = ["bandit:B607"]
set.ignored = true

# bandit:B310 — urllib.request.urlopen for HTTPS API calls with timeout
[[triage]]
match.rules = ["bandit:B310"]
set.ignored = true

# bandit:B311 — random.Random for deterministic test variant selection (not crypto)
[[triage]]
match.rules = ["bandit:B311"]
set.ignored = true

# radarlint S1244 — float equality is intentional in scoring code
# (confidence scores, thresholds — exact comparison by design)
[[triage]]
match.rules = ["radarlint-python:python:S1244"]
set.mode = "monitor"

# radarlint S1481 — unused vars from tuple unpacking are idiomatic Python
[[triage]]
match.rules = ["radarlint-python:python:S1481"]
set.mode = "monitor"
