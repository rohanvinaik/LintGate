name: Security Lite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets + SAST + Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            export GOBIN="$HOME/.local/bin"
            export PATH="$GOBIN:$PATH"
            go install github.com/zricethezav/gitleaks/v8@v8.30.0
            echo "$GOBIN" >> "$GITHUB_PATH"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install security linters
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install bandit pip-audit

      - name: Run Bandit (fast, scoped)
        run: bash scripts/ci/run_security_lite_gate.sh
