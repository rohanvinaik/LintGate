name: Security Lite

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets + SAST + Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit (fast, scoped)
        run: |
          bandit -q -r . \
            -x tests,.venv,venv,env,__pycache__,.git,node_modules,docs \
            -s B101,B105,B106,B108,B110,B112,B310,B311,B404,B603,B607

      - name: Run pip-audit (requirements if present)
        shell: bash
        run: |
          shopt -s nullglob
          reqs=(requirements*.txt)
          if [ ${#reqs[@]} -eq 0 ]; then
            echo "No requirements*.txt found; skipping pip-audit."
            exit 0
          fi
          for f in "${reqs[@]}"; do
            echo "Auditing $f"
            pip-audit -r "$f"
          done
