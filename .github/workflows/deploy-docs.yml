name: Deploy Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'wiki.yaml'
      - 'lintgate/wiki/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install
        run: uv sync --extra dev

      - name: Build wiki
        run: |
          uv run python -c "
          from lintgate.wiki.manifest import load_manifest
          from lintgate.wiki.composer import compose_all_pages
          from lintgate.wiki.pages_publisher import publish_pages
          import os, sys

          root = os.getcwd()
          manifest = load_manifest(root)
          if manifest is None:
              print('No wiki manifest — skipping.')
              sys.exit(0)

          composed = compose_all_pages(manifest, root)
          result = publish_pages(
              manifest=manifest, composed=composed, project_root=root,
              out_dir='_site', check_links=True, site_title='LintGate',
          )
          print(f'Published {len(result.pages)} pages')
          if result.link_errors:
              for err in result.link_errors:
                  print(f'  {err}')
              sys.exit(1)
          "

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
