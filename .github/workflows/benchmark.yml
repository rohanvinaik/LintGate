name: Performance Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install pytest-benchmark
          pip install -e .[dev,algebra]
          
      - name: Run benchmarks
        id: run_benchmarks
        continue-on-error: true
        run: |
          pytest tests/ --benchmark-only --benchmark-json output.json
          # Verify output is valid JSON (empty file = no benchmark tests found)
          if [ ! -s output.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No benchmark tests found — skipping store step."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark results
        if: steps.run_benchmarks.outputs.skip != 'true'
        uses: benchmark-action/github-action-benchmark@4bdcce38c94cec68da58d012ac24b7b1155efe8b # v1
        with:
          name: Python Benchmark with pytest-benchmark
          tool: 'pytest'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@rohanvinaik'
