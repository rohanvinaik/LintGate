name: Performance Benchmark

# Runs pytest-benchmark tests and tracks results over time.
# Alerts on >200% regression via benchmark-action/github-action-benchmark.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install pytest-benchmark
          pip install -e .[dev,algebra]

      - name: Run benchmarks
        id: run_benchmarks
        continue-on-error: true
        run: |
          pytest tests/test_benchmarks.py --benchmark-only --benchmark-json output.json -v
          if [ ! -s output.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No benchmark tests found — skipping store step."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark results
        if: steps.run_benchmarks.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@a7bc2366eda11037936ea57d811a43b3418d3073 # v1
        with:
          name: Performance Benchmarks
          tool: 'pytest'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: badges
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@rohanvinaik'
