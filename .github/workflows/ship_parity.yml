name: Ship Gate Parity Guard

on:
    push:
        branches: [main]
        paths:
            - ".githooks/pre-push"
            - "scripts/ship_main.py"
            - "gate_contract.yaml"
            - ".github/workflows/ship_parity.yml"
    pull_request:
        paths:
            - ".githooks/pre-push"
            - "scripts/ship_main.py"
            - "gate_contract.yaml"
            - ".github/workflows/ship_parity.yml"

permissions:
    contents: read

jobs:
    test-parity:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip==25.0.1
                  pip install -e .[dev]

            - name: Run ship_main.py tests
              run: pytest tests/test_ship_main.py -v

            - name: Test preflight execution deterministic output
              run: |
                  # pre-push skips on LINTGATE_SKIP_PRE_PUSH=1, exiting 0
                  OUTPUT=$(LINTGATE_SKIP_PRE_PUSH=1 python scripts/ship_main.py --preflight --json)
                  echo "Preflight JSON Output: $OUTPUT"
                  STATUS=$(echo "$OUTPUT" | jq -r .status)
                  if [ "$STATUS" != "pass" ]; then
                    echo "Parity Guard Failed: Expected status 'pass', got '$STATUS'"
                    exit 1
                  fi
