name: Wesker Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wesker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rohanvinaik/Wesker@main
        id: wesker
        with:
          targets: lintgate/
          threshold: 80
          exclude: lintgate/linters/ lintgate/renderers/
          budget: "15000"
          max-per-category: "3"

      - name: Summary
        if: always()
        run: |
          echo "### Wesker Mutation Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Kill rate: **${{ steps.wesker.outputs.kill-rate }}%** (${{ steps.wesker.outputs.total-killed }}/${{ steps.wesker.outputs.total-mutants }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.wesker.outputs.mcdc-status }}" != "none" ]; then
            echo "MC/DC: **${{ steps.wesker.outputs.mcdc-status }}**" >> $GITHUB_STEP_SUMMARY
          fi
