name: Qlty Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qlty:
    name: Qlty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install qlty
        uses: qltysh/qlty-action/install@141b881236146435192435eb7b0e06ea0b70b4d9 # main

      - name: Initialize qlty (if needed)
        run: true

      - name: Run qlty checks
        run: bash scripts/ci/run_qlty_gate.sh
