name: Qlty Analysis

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qlty:
    name: Qlty Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install qlty
        uses: qltysh/qlty-action/install@main

      - name: Run qlty checks
        run: qlty check --all
