name: Qlty Analysis

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qlty:
    name: Qlty Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install qlty
        uses: qltysh/qlty-action/install@main

      - name: Initialize qlty (if needed)
        run: |
          if ! qlty check --all --dry-run >/dev/null 2>&1; then
            qlty init --skip-plugins 2>/dev/null || true
          fi

      - name: Run qlty checks
        run: qlty check --all
