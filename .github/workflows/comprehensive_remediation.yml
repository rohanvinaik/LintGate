name: Remediation Guard

on:
    pull_request:
        paths:
            - "lintgate/channels/**"
            - "lintgate/controlplane/**"
            - ".github/workflows/**"
            - ".githooks/pre-push"
            - "scripts/ship_main.py"
            - "mcp_tools/onboarding_tools.py"
            - "gate_contract.yaml"

jobs:
    validate-remediation-plan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Collect changed files
              id: changed-files
              uses: actions/github-script@v7
              with:
                  script: |
                      const files = await github.paginate(
                        github.rest.pulls.listFiles,
                        {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.payload.pull_request.number,
                          per_page: 100,
                        }
                      );
                      return JSON.stringify(files.map((f) => f.filename));

            - name: Enforce Gates Impact Acknowledgments
              env:
                  PR_BODY: ${{ github.event.pull_request.body }}
                  CHANGED_FILES_JSON: ${{ steps.changed-files.outputs.result }}
              run: |
                  python scripts/check_remediation_plan.py
