name: Mutation Testing

# Injects small code changes (mutants) and checks whether the test suite
# catches them. Killed = detected, survived = gap in test effectiveness.
# Tool: mutmut v3. Config: pyproject.toml [tool.mutmut]. Schedule: weekly + on push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install mutmut==3.5.0
          pip install -e ".[dev]"

      - name: Run mutation testing
        id: mutmut
        run: |
          set +e
          mutmut run
          echo "mutmut_rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Check mutmut exit code
        run: |
          RC=${{ steps.mutmut.outputs.mutmut_rc }}
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ] && [ "$RC" -ne 2 ]; then
            echo "::error::mutmut encountered a hard runner error (exit code $RC)"
            exit 1
          fi

      - name: Export mutation stats
        run: |
          mutmut export-cicd-stats || true
          mutmut results --all true > mutants/mutmut-survivors.txt 2>/dev/null || true

      - name: Parse results and generate badge
        id: parse
        run: python scripts/parse_mutation_stats.py
        env:
          STATS_PATH: mutants/mutmut-cicd-stats.json

      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-stats
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-survivors.json
          if-no-files-found: warn

      - name: Generate mutation badge
        if: steps.parse.outputs.skip != 'true'
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Mutation Score"
          status: "${{ steps.parse.outputs.score }}%"
          color: "${{ steps.parse.outputs.color }}"
          path: ".github/badges/mutation.svg"

      - name: Push badge to badges branch
        if: steps.parse.outputs.skip != 'true'
        run: |
          cp .github/badges/mutation.svg /tmp/mutation.svg
          rm -rf .github/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git checkout badges
          mkdir -p .github/badges
          cp /tmp/mutation.svg .github/badges/mutation.svg
          git add .github/badges/mutation.svg
          git commit -m "Update mutation badge (${{ steps.parse.outputs.score }}% — ${{ steps.parse.outputs.killed }}/${{ steps.parse.outputs.total }} killed)" || echo "No changes"
          git push origin badges
