name: Mutation Testing

# Injects small code changes (mutants) and checks whether the test suite
# catches them. Killed = detected, survived = gap in test effectiveness.
# Tool: mutmut v3. Config: pyproject.toml [tool.mutmut]. Schedule: weekly + on push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install "mutmut>=3.5,<4"
          pip install -e ".[dev]"

      - name: Run mutation testing
        run: mutmut run || true

      - name: Parse results and generate badge
        id: parse
        run: |
          mutmut export-cicd-stats || true

          python - <<'PY'
          import json, os
          from pathlib import Path

          stats_path = Path("mutants/mutmut-cicd-stats.json")
          if not stats_path.exists():
              print("No mutmut stats found — skipping badge generation")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("skip=true\n")
              raise SystemExit(0)

          stats = json.loads(stats_path.read_text())
          killed = stats.get("killed", 0)
          survived = stats.get("survived", 0)
          timeout = stats.get("timeout", 0)
          suspicious = stats.get("suspicious", 0)
          total = killed + survived + timeout + suspicious

          if total == 0:
              print("No mutations tested — skipping badge")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("skip=true\n")
              raise SystemExit(0)

          score = round(killed / total * 100, 1)

          if score >= 80:
              color = "brightgreen"
          elif score >= 60:
              color = "yellow"
          else:
              color = "red"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip=false\n")
              fh.write(f"score={score}\n")
              fh.write(f"color={color}\n")
              fh.write(f"killed={killed}\n")
              fh.write(f"survived={survived}\n")
              fh.write(f"total={total}\n")

          print(f"## Results")
          print(f"")
          print(f"Mutation score: {score}%")
          print(f"  Killed (detected):   {killed}")
          print(f"  Survived (missed):   {survived}")
          print(f"  Timeout:             {timeout}")
          print(f"  Suspicious:          {suspicious}")
          print(f"  Total mutants:       {total}")
          PY

      - name: Generate mutation badge
        if: steps.parse.outputs.skip != 'true'
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Mutation Score"
          status: "${{ steps.parse.outputs.score }}%"
          color: "${{ steps.parse.outputs.color }}"
          path: ".github/badges/mutation.svg"

      - name: Push badge to badges branch
        if: steps.parse.outputs.skip != 'true'
        run: |
          cp .github/badges/mutation.svg /tmp/mutation.svg
          rm -rf .github/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git checkout badges
          mkdir -p .github/badges
          cp /tmp/mutation.svg .github/badges/mutation.svg
          git add .github/badges/mutation.svg
          git commit -m "Update mutation badge (${{ steps.parse.outputs.score }}% — ${{ steps.parse.outputs.killed }}/${{ steps.parse.outputs.total }} killed)" || echo "No changes"
          git push origin badges
