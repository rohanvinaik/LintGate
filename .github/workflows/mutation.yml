name: Mutation Testing

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install mutmut
          pip install -e ".[dev]"

      - name: Select mutation targets
        id: targets
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          # Target the architectural core: controlplane + channels
          # Exclude WIP files with 0% coverage
          EXCLUDE = {
              "lintgate/controlplane/cli.py",
              "lintgate/channels/performance_channel.py",
          }

          targets = []
          for directory in ["lintgate/controlplane", "lintgate/channels"]:
              for f in sorted(Path(directory).glob("*.py")):
                  rel = str(f)
                  if rel not in EXCLUDE and f.name != "__init__.py":
                      targets.append(rel)

          paths = ",".join(targets)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"paths={paths}\n")
          print(f"Mutation targets ({len(targets)} files):")
          for t in targets:
              print(f"  {t}")
          PY

      - name: Run mutation testing
        run: |
          mutmut run \
            --paths-to-mutate="${{ steps.targets.outputs.paths }}" \
            --runner="python -m pytest tests/ -x -q --timeout=30 --tb=no" \
            --tests-dir=tests/ \
            || true

      - name: Parse results and generate badge
        id: parse
        run: |
          python - <<'PY'
          import os, sqlite3
          from pathlib import Path

          db = Path(".mutmut-cache")
          if not db.exists():
              print("No mutmut cache found — skipping badge generation")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("skip=true\n")
              raise SystemExit(0)

          conn = sqlite3.connect(str(db))
          rows = conn.execute(
              "SELECT status, count(*) FROM mutant GROUP BY status"
          ).fetchall()
          conn.close()
          counts = dict(rows)

          killed = counts.get("killed", 0)
          survived = counts.get("survived", 0)
          timeout = counts.get("timeout", 0)
          suspicious = counts.get("suspicious", 0)
          total = killed + survived + timeout + suspicious

          if total == 0:
              print("No mutations generated — skipping badge")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("skip=true\n")
              raise SystemExit(0)

          score = round(killed / total * 100, 1)

          if score >= 80:
              color = "brightgreen"
          elif score >= 60:
              color = "yellow"
          else:
              color = "red"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip=false\n")
              fh.write(f"score={score}\n")
              fh.write(f"color={color}\n")
              fh.write(f"killed={killed}\n")
              fh.write(f"survived={survived}\n")
              fh.write(f"total={total}\n")

          print(f"Mutation score: {score}%")
          print(f"  killed:     {killed}")
          print(f"  survived:   {survived}")
          print(f"  timeout:    {timeout}")
          print(f"  suspicious: {suspicious}")
          print(f"  total:      {total}")
          PY

      - name: Generate mutation badge
        if: steps.parse.outputs.skip != 'true'
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Mutation Score"
          status: "${{ steps.parse.outputs.score }}%"
          color: "${{ steps.parse.outputs.color }}"
          path: ".github/badges/mutation.svg"

      - name: Commit badge
        if: steps.parse.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "Update mutation score badge (${{ steps.parse.outputs.score }}% — ${{ steps.parse.outputs.killed }}/${{ steps.parse.outputs.total }} killed)"
          file_pattern: ".github/badges/mutation.svg"
