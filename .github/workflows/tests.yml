name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.12"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Full history for diff-cover

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Validate workflow action references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/validate_action_refs.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install -e ".[dev]" 2>/dev/null \
            || python -m pip install -e "." 2>/dev/null \
            || python -m pip install pytest
          python -m pip install pytest-cov diff-cover

      - name: Resolve quality policy thresholds
        id: quality_policy
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output(
              ["python", "scripts/ci/resolve_quality_policy.py"],
              text=True,
          )
          data = json.loads(raw)
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"coverage_min={data['coverage_min']}\n")
              fh.write(f"diff_coverage_min={data['diff_coverage_min']}\n")
              fh.write(f"cov_args={' '.join(data['cov_args'])}\n")
          PY

      - name: Run tests with coverage (telemetry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CONTRACT: bash scripts/ci/run_tests_gate.sh --python-version 3.11
          # CONTRACT: bash scripts/ci/run_tests_gate.sh --python-version 3.12
          bash scripts/ci/run_tests_gate.sh --python-version "${{ matrix.python-version }}"

      - name: Enforce symbol coverage gate
        run: echo "symbol gate enforced inside scripts/ci/run_tests_gate.sh"

      - name: Diff coverage telemetry (non-blocking)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=${{ steps.quality_policy.outputs.diff_coverage_min }}

      - name: Generate quality status artifact
        if: always()
        run: |
          python -c "
          import datetime, json, xml.etree.ElementTree as ET

          status = {
              'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'coverage_pct': 0.0,
              'tests_collected': 0,
              'tests_passed': 0,
              'tests_failed': 0,
              'tests_errors': 0,
              'tests_skipped': 0,
              'security_issues': 0,
          }

          # Parse coverage from coverage.xml
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              rate = float(root.attrib.get('line-rate', 0))
              status['coverage_pct'] = round(rate * 100, 1)
          except Exception:
              pass

          # Parse test counts from pytest JUnit report
          try:
              tree = ET.parse('pytest-results.xml')
              root = tree.getroot()
              status['tests_collected'] = int(root.attrib.get('tests', 0))
              status['tests_failed'] = int(root.attrib.get('failures', 0))
              status['tests_errors'] = int(root.attrib.get('errors', 0))
              status['tests_skipped'] = int(root.attrib.get('skipped', 0))
              status['tests_passed'] = max(
                  0,
                  status['tests_collected']
                  - status['tests_failed']
                  - status['tests_errors']
                  - status['tests_skipped'],
              )
          except Exception:
              pass

          with open('quality-status.json', 'w') as f:
              json.dump(status, f, indent=2)
          print(json.dumps(status, indent=2))
          "

      - name: Upload quality status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-status-${{ matrix.python-version }}
          path: quality-status.json
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-results.xml
          retention-days: 30
