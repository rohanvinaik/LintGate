name: Specification Badges

# Computes symbolic specification metrics from the codebase:
# - Purity: side-effect-free function count (AST-based)
# - Algebraic Properties: total detected property instances
# - σ̄ (mean specification complexity): behavioral dimensions per function
# - Spec Coverage (K/σ, weighted): global assertion budget over global sigma budget
# - Spec Coverage (semantic-adjusted): weighted by semantic assertion ratio
# - Regime Distribution: A (tractable) vs B (requires alternatives), symbolic source

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec_badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install -e .[dev,algebra]

      - name: Extract project metrics
        id: metrics
        run: |
          python - <<'PY'
          import os

          from lintgate.discovery import discover_project_files

          # ── Algebra layer: purity + properties ──────────────────────
          from lintgate.linters.performance_checks.manifest import build_manifest

          def _is_test_file(path: str) -> bool:
              rel = os.path.relpath(path, ".").replace("\\", "/")
              base = os.path.basename(path)
              if rel.startswith("tests/") or "/tests/" in rel:
                  return True
              if "/" not in rel and (base.startswith("test_") or base.endswith("_test.py")):
                  return True
              return False

          all_py_files = discover_project_files(".")
          source_files = [p for p in all_py_files if not _is_test_file(p)]
          test_files = [p for p in all_py_files if _is_test_file(p)]

          manifest = build_manifest(".", source_files)
          total_funcs = manifest.pure_count + manifest.impure_count
          props_total = sum(manifest.property_distribution.values())
          purity_pct = round(100 * manifest.pure_count / max(total_funcs, 1))

          dist = {k.value: v for k, v in manifest.property_distribution.items()}
          print(
              f"Scope: {len(source_files)} source files, "
              f"{len(test_files)} test files, {len(all_py_files)} total"
          )
          print(f"Pure functions: {manifest.pure_count} / {total_funcs} ({purity_pct}%)")
          print(f"Algebraic properties: {props_total}")
          for prop, count in sorted(dist.items()):
              print(f"  {prop}: {count}")

          # ── Specification layer: σ, K/σ, regime ────────────────────
          from lintgate.linters.test_effectiveness.manifest import build_test_effectiveness_manifest
          from lintgate.specification.ledger import build_specification_ledger

          teff_manifest = build_test_effectiveness_manifest(
              project_root=".",
              python_files=source_files,
              test_files=test_files,
          )
          ledger = build_specification_ledger(
              property_manifest=manifest,
              teff_manifest=teff_manifest,
              project_root=".",
              py_files=source_files,
              test_files=test_files,
          )

          n_funcs = len(ledger.functions)
          mean_sigma = round(ledger.total_sigma / max(n_funcs, 1), 1)

          sigma_total = sum(fs.core.estimated_sigma for fs in ledger.functions.values())
          raw_k_total = sum(
              min(fs.traceability.assertion_count, fs.core.estimated_sigma)
              for fs in ledger.functions.values()
          )
          semantic_k_total = sum(
              min(
                  fs.traceability.assertion_count * fs.core.semantic_ratio,
                  fs.core.estimated_sigma,
              )
              for fs in ledger.functions.values()
          )
          spec_cov_weighted = (raw_k_total / sigma_total) if sigma_total else 0.0
          spec_cov_sem_weighted = (semantic_k_total / sigma_total) if sigma_total else 0.0
          spec_cov = round(spec_cov_weighted, 3)
          spec_cov_pct = round(spec_cov_weighted * 100)
          spec_cov_sem = round(spec_cov_sem_weighted, 3)
          spec_cov_sem_pct = round(spec_cov_sem_weighted * 100)

          regime_a = ledger.regime_distribution.get("A", 0)
          regime_b = ledger.regime_distribution.get("B", 0)
          regime_source = "symbolic"

          print(f"\nSpecification metrics ({n_funcs} functions):")
          print(f"  Mean σ: {mean_sigma}")
          print(f"  Spec coverage (K/σ, weighted raw): {spec_cov}")
          print(f"  Spec coverage (K/σ, weighted semantic): {spec_cov_sem}")
          print(f"  Regime A: {regime_a}, B: {regime_b} (source={regime_source})")
          print(f"  Mean testability: {round(ledger.mean_testability, 2)}")
          print(f"  Stop criteria met: {ledger.stop_criteria_met_count}")

          # ── Test count ──────────────────────────────────────────────
          import subprocess
          count_result = subprocess.run(
              ["python", "-m", "pytest", "--co", "-q"],
              capture_output=True, text=True, timeout=120,
          )
          test_count = sum(
              1 for line in count_result.stdout.splitlines()
              if "::" in line
          )
          print(f"\nTest count: {test_count}")

          # ── Mutation kill rate (sampled, fast) ───────────────────────
          killed, survived = 0, 0
          import json as _json
          from pathlib import Path as _Path
          cache_dir = _Path(".lintgate/mutation")
          if cache_dir.exists():
              for mf in cache_dir.glob("*.json"):
                  if mf.name in ("sweep_summary.json", "scheduler_state.json"):
                      continue
                  try:
                      md = _json.loads(mf.read_text())
                      killed += md.get("total_killed", 0)
                      survived += md.get("total_survived", 0)
                  except Exception:
                      pass
          if killed + survived == 0:
              # Run fast sampled sweep if no cached data
              print("No cached mutation data — running fast sweep...")
              sweep_result = subprocess.run(
                  ["python", "scripts/colab_mutation_sweep.py", "."],
                  capture_output=True, text=True, timeout=600,
                  env={**os.environ, "MUTATION_WORKERS": "2", "MUTATION_BUDGET_MS": "300"},
              )
              for mf in cache_dir.glob("*.json"):
                  if mf.name in ("sweep_summary.json", "scheduler_state.json"):
                      continue
                  try:
                      md = _json.loads(mf.read_text())
                      killed += md.get("total_killed", 0)
                      survived += md.get("total_survived", 0)
                  except Exception:
                      pass
          total_mutants = killed + survived
          kill_rate_pct = round(100 * killed / max(total_mutants, 1))
          print(f"Mutation kill rate: {killed}/{total_mutants} ({kill_rate_pct}%)")

          # ── Write to GITHUB_ENV ─────────────────────────────────────
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"PURE_COUNT={manifest.pure_count}\n")
              fh.write(f"TOTAL_FUNCTIONS={total_funcs}\n")
              fh.write(f"PURITY_PCT={purity_pct}\n")
              fh.write(f"PROPERTIES_COUNT={props_total}\n")
              fh.write(f"MEAN_SIGMA={mean_sigma}\n")
              fh.write(f"SPEC_COVERAGE={spec_cov}\n")
              fh.write(f"SPEC_COVERAGE_PCT={spec_cov_pct}\n")
              fh.write(f"SPEC_COVERAGE_SEM={spec_cov_sem}\n")
              fh.write(f"SPEC_COVERAGE_SEM_PCT={spec_cov_sem_pct}\n")
              fh.write(f"REGIME_A={regime_a}\n")
              fh.write(f"REGIME_B={regime_b}\n")
              fh.write(f"REGIME_SOURCE={regime_source}\n")
              fh.write(f"SPEC_FUNCTIONS={n_funcs}\n")
              fh.write(f"TEST_COUNT={test_count}\n")
              fh.write(f"MUTATION_KILLED={killed}\n")
              fh.write(f"MUTATION_TOTAL={total_mutants}\n")
              fh.write(f"MUTATION_KILL_PCT={kill_rate_pct}\n")
          PY

      # ── Algebra badges ──────────────────────────────────────────────

      - name: Generate Purity Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Side-Effect-Free"
          status: "${{ env.PURE_COUNT }} / ${{ env.TOTAL_FUNCTIONS }} functions"
          color: "success"
          path: ".github/badges/purity.svg"

      - name: Generate Property Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Algebraic Properties"
          status: "${{ env.PROPERTIES_COUNT }} instances"
          color: "blue"
          path: ".github/badges/properties.svg"

      # ── Specification badges ────────────────────────────────────────

      - name: "Generate σ̄ Badge"
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Mean σ"
          status: "${{ env.MEAN_SIGMA }} dimensions"
          color: "8b5cf6"
          path: ".github/badges/sigma.svg"

      - name: Generate Spec Coverage Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "K/σ Coverage"
          status: "${{ env.SPEC_COVERAGE_PCT }}% raw / ${{ env.SPEC_COVERAGE_SEM_PCT }}% sem"
          color: "0ea5e9"
          path: ".github/badges/spec-coverage.svg"

      - name: Generate Regime Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Regime"
          status: "${{ env.REGIME_A }}A / ${{ env.REGIME_B }}B (${{ env.REGIME_SOURCE }})"
          color: "f59e0b"
          path: ".github/badges/regime.svg"

      # ── Mutation & test badges ───────────────────────────────────

      - name: Compute mutation badge color
        id: mutation_color
        run: |
          pct=${{ env.MUTATION_KILL_PCT }}
          if [ "$pct" -ge 80 ]; then echo "color=success" >> "$GITHUB_OUTPUT"
          elif [ "$pct" -ge 60 ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"
          else echo "color=critical" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Mutation Kill Rate Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Mutation Kill Rate"
          status: "${{ env.MUTATION_KILL_PCT }}% (${{ env.MUTATION_KILLED }}/${{ env.MUTATION_TOTAL }})"
          color: "${{ steps.mutation_color.outputs.color }}"
          path: ".github/badges/mutation-kill-rate.svg"

      - name: Generate Test Count Badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Tests"
          status: "${{ env.TEST_COUNT }}"
          color: "success"
          path: ".github/badges/test-count.svg"

      # ── Push all badges to badges branch ────────────────────────────

      - name: Push badges to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp .github/badges/*.svg /tmp/
          rm -rf .github/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges:badges
            git switch badges
          else
            git switch --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p .github/badges
          cp /tmp/*.svg .github/badges/
          git add .github/badges/*.svg

          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi

          git commit -m "Update spec badges (σ̄=${{ env.MEAN_SIGMA }}, K/σw=${{ env.SPEC_COVERAGE }}, K/σsem=${{ env.SPEC_COVERAGE_SEM }}, ${{ env.PURE_COUNT }}/${{ env.TOTAL_FUNCTIONS }} pure, ${{ env.PROPERTIES_COUNT }} properties)"
          git push origin badges
