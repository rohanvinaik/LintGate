name: Specification Badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec_badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install git+https://github.com/rohanvinaik/Wesker.git

      # ── Metrics computation ─────────────────────────────────────
      - name: Compute specification metrics
        run: |
          # Mutation kill rate via Wesker
          python -m Wesker lintgate/ --exclude lintgate/linters/ lintgate/renderers/ --json > .wesker-report.json 2>&1 || true
          KILL_PCT=$(python -c "import json; d=json.load(open('.wesker-report.json')); print(d.get('mutation',{}).get('kill_pct',0))" 2>/dev/null || echo "0")
          KILLED=$(python -c "import json; d=json.load(open('.wesker-report.json')); print(d.get('mutation',{}).get('total_killed',0))" 2>/dev/null || echo "0")
          TOTAL=$(python -c "import json; d=json.load(open('.wesker-report.json')); print(d.get('mutation',{}).get('total_mutants',0))" 2>/dev/null || echo "0")
          FUNCS=$(python -c "import json; d=json.load(open('.wesker-report.json')); print(d.get('mutation',{}).get('total_functions',0))" 2>/dev/null || echo "0")

          # Test count
          TEST_COUNT=$(python -m pytest tests/ --co -q 2>/dev/null | grep '::' | wc -l | tr -d ' ')
          SOURCE_LOC=$(find lintgate/ -name '*.py' -exec cat {} + | grep -cv '^\s*$\|^\s*#' || echo "0")
          RATIO="1:$(python -c "print(round($SOURCE_LOC / max($TEST_COUNT, 1), 1))")"

          # Mean sigma
          SIGMA=$(python -c "
          import ast, os
          from pathlib import Path
          total, count = 0, 0
          for py in Path('lintgate').rglob('*.py'):
              if '__pycache__' in str(py): continue
              try:
                  tree = ast.parse(py.read_text())
              except: continue
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      s = max(sum(1 for _ in ast.walk(node) if isinstance(_, (ast.Compare, ast.Return, ast.If, ast.IfExp))), 1)
                      total += s; count += 1
          print(round(total / max(count, 1), 1))
          ")

          # Export to GITHUB_ENV
          {
            echo "MUTATION_KILL_PCT=$KILL_PCT"
            echo "MUTATION_KILLED=$KILLED"
            echo "MUTATION_TOTAL=$TOTAL"
            echo "MUTATION_FUNCTIONS=$FUNCS"
            echo "TEST_COUNT=$TEST_COUNT"
            echo "TEST_RATIO=$RATIO"
            echo "MEAN_SIGMA=$SIGMA"
          } >> "$GITHUB_ENV"

          echo "Mutation: $KILLED/$TOTAL ($KILL_PCT%)"
          echo "Tests: $TEST_COUNT ($RATIO)"
          echo "Mean σ: $SIGMA across $FUNCS functions"

      - name: Create badges directory
        run: mkdir -p .github/badges

      # ── Badge generation ────────────────────────────────────────

      - name: Generate Mutation Kill Rate Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: "Mutation Kill Rate"
          label-color: "333"
          status: "${{ env.MUTATION_KILL_PCT }}% (${{ env.MUTATION_KILLED }}/${{ env.MUTATION_TOTAL }})"
          color: ${{ env.MUTATION_KILL_PCT == '100' && '2ea043' || env.MUTATION_KILL_PCT >= '80' && 'f0ad4e' || 'e5534b' }}
          path: ".github/badges/mutation-kill-rate.svg"

      - name: "Generate Mean σ Badge"
        uses: emibcn/badge-action@v2.0.2
        with:
          label: "Mean σ"
          label-color: "333"
          status: "${{ env.MEAN_SIGMA }}"
          color: "8b5cf6"
          path: ".github/badges/sigma.svg"

      - name: Generate Test Count Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: "Tests"
          label-color: "333"
          status: "${{ env.TEST_COUNT }} (${{ env.TEST_RATIO }})"
          color: "2ea043"
          path: ".github/badges/test-count.svg"

      # ── Push to badges branch ──────────────────────────────────

      - name: Push badges to badges branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp .github/badges/*.svg /tmp/
          rm -rf .github/badges

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges:badges
            git switch badges
          else
            git switch --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p .github/badges
          cp /tmp/*.svg .github/badges/
          git add .github/badges/*.svg

          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi

          git commit -m "Update spec badges (kill=${{ env.MUTATION_KILL_PCT }}%, σ̄=${{ env.MEAN_SIGMA }}, tests=${{ env.TEST_COUNT }})"
          git push origin badges
