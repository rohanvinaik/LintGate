name: Design
description: Scoped design or architecture proposal
labels: ["enhancement", "type:architecture"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What current limitation does this address?
      placeholder: Describe the gap or limitation in the current architecture.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      description: Core abstractions, data flows, interfaces, YAML config examples.
      placeholder: Describe the proposed design with enough detail to implement.
    validations:
      required: true

  - type: textarea
    id: connection
    attributes:
      label: Connection to Existing System
      description: Which modules are extended or replaced?
      placeholder: List specific modules, files, and interfaces affected.
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: Acceptance conditions for this design.
      placeholder: What must be true for this design to be considered complete?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blocking or blocked-by issues.
      placeholder: "List related issues (e.g., blocked by #123, blocks #456)."
    validations:
      required: false
