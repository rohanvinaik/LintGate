[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lintgate"
version = "0.2.0"
description = "Proactive professional cognition stack for LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rohan Vinaik"},
]
keywords = ["linting", "claude-code", "llm", "code-quality", "mcp", "ai-coding", "professionalization", "engineering-discipline", "secrets-detection", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# Core dependencies — only PyYAML for config loading
# All linters (ruff, mypy, radon, bandit) are optional
dependencies = [
    "pyyaml>=6.0",
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
    "Wesker @ git+https://github.com/rohanvinaik/Wesker.git",
]

[project.optional-dependencies]
# Install all linters
full = [
    "ruff>=0.4.0",
    "mypy>=1.8",
    "ty>=0.0.17",
    "radon>=6.0",
    "bandit>=1.9.4",
    "vulture>=2.0",
    "pip-audit>=2.6",
]
# MCP server
mcp = [
    "mcp>=1.0",
]
# Algebra (Property testing and contracts)
algebra = [
    "hypothesis>=6.0",
    "icontract>=2.6"
]
# Refactoring (safe module moves)
refactor = [
    "libcst>=1.0",
]
# Development
dev = [
    "lintgate[full,mcp,algebra,refactor]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
]

[project.scripts]
lintgate = "lintgate.hook_posttooluse:main"
lintgate-pre = "lintgate.hook_pretooluse:main"
lintgate-admin = "lintgate.cli.admin:main"
lintgate-mcp = "mcp_server:run_server"
lintgate-mcp-lite = "mcp_server_lite:run_server"
controlplane = "lintgate.controlplane.cli:main"
controlplane-mcp = "mcp_server:run_server"

[tool.hatch.metadata]
# Wesker is git-only (not published to PyPI); allow direct URL reference
# in the dependencies list. Lintgate itself is not published to PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Include mcp_server.py at the root of the wheel so `mcp_server:mcp.run`
# entry points resolve correctly when installed as a package.
packages = ["lintgate", "mcp_tools"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"
"mcp_server_lite.py" = "mcp_server_lite.py"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["docs/mutation/Aristotle/Mutation_Theory/.lake/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC"]
ignore = [
    "E501",  # Line length handled by formatter
    "E402",  # Module-level import not at top — deferred imports in register() pattern
    "N802",  # Function name should be lowercase — libcst visitor methods (leave_ImportFrom etc.)
    "N806",  # Variable in function should be lowercase — local constants (_SKIP, _AUG_OPS)
    "SIM102", # Nested if — often clearer than merged condition for AST traversals
]

[tool.ruff.lint.isort]
known-first-party = ["lintgate", "mcp_tools"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
check_untyped_defs = true
exclude = ["docs/mutation/Aristotle/Mutation_Theory/\\.lake/"]

[tool.ty]
exclude = ["docs/mutation/Aristotle/Mutation_Theory/.lake/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.wesker]
# Wesker specification-metrics scope for the spec-badges CI workflow.
#
# lintgate has ~300 source files and 11k+ tests. Wesker's default behaviour is
# to (a) run in-process mutation profiling across every file in `source_dir`
# and (b) auto-discover every function containing a relational operator and
# run a full pytest suite per operator swap for MC/DC verification.
#
# Neither is feasible on the full lintgate tree in CI:
#   - In-process profiling: ~300 files × 10s budget each ≈ 50 min (too long).
#   - MC/DC auto-discovery: hundreds of functions × N conditions × 5 ROR swaps
#     × one full pytest run each → many hours.
#
# We scope Wesker to `lintgate/specification/` (the scoring / classification
# core) and provide an explicit, tight `mcdc_targets` list to suppress
# auto-discovery. The spec/ core is small, relational-operator-dense, and
# directly drives regime classification — exactly what MC/DC wants to verify.
source_dir = "lintgate/specification"
exclude = [
    "lintgate/specification/__init__.py",
]
mcdc_targets = [
    ["lintgate/specification/test_regeneration_strategy.py", "_compute_confidence"],
    ["lintgate/specification/test_regeneration_strategy.py", "_has_discovery_artifact"],
]
max_per_category = 3
convergence_passes = 1
