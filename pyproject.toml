[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lintgate"
version = "0.2.0"
description = "Proactive professional cognition stack for LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rohan Vinaik"},
]
keywords = ["linting", "claude-code", "llm", "code-quality", "mcp", "ai-coding", "professionalization", "engineering-discipline", "secrets-detection", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# Core dependencies — only PyYAML for config loading
# All linters (ruff, mypy, radon, bandit) are optional
dependencies = [
    "pyyaml>=6.0",
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Install all linters
full = [
    "ruff>=0.4.0",
    "mypy>=1.8",
    "ty>=0.0.17",
    "radon>=6.0",
    "bandit>=1.7",
    "vulture>=2.0",
    "pip-audit>=2.6",
]
# MCP server
mcp = [
    "mcp>=1.0",
]
# Algebra (Property testing and contracts)
algebra = [
    "hypothesis>=6.0",
    "icontract>=2.6"
]
# Refactoring (safe module moves)
refactor = [
    "libcst>=1.0",
]
# Development
dev = [
    "lintgate[full,mcp,algebra,refactor]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
]

[project.scripts]
lintgate = "lintgate.hook_posttooluse:main"
lintgate-pre = "lintgate.hook_pretooluse:main"
lintgate-admin = "lintgate.cli.admin:main"
lintgate-mcp = "mcp_server:run_server"
controlplane = "lintgate.controlplane.cli:main"
controlplane-mcp = "mcp_server:run_server"

[tool.hatch.build.targets.wheel]
# Include mcp_server.py at the root of the wheel so `mcp_server:mcp.run`
# entry points resolve correctly when installed as a package.
packages = ["lintgate", "mcp_tools"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["docs/mutation/Aristotle/Mutation_Theory/.lake/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC"]
ignore = [
    "E501",  # Line length handled by formatter
    "E402",  # Module-level import not at top — deferred imports in register() pattern
    "N802",  # Function name should be lowercase — libcst visitor methods (leave_ImportFrom etc.)
    "N806",  # Variable in function should be lowercase — local constants (_SKIP, _AUG_OPS)
    "SIM102", # Nested if — often clearer than merged condition for AST traversals
]

[tool.ruff.lint.isort]
known-first-party = ["lintgate", "mcp_tools"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
check_untyped_defs = true
exclude = ["docs/mutation/Aristotle/Mutation_Theory/\\.lake/"]

[tool.ty]
exclude = ["docs/mutation/Aristotle/Mutation_Theory/.lake/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
